name: Build Fabric Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Automatically Fix Project Layout
      # This creates the mandatory Java folders and moves your file into place
      run: |
        mkdir -p src/main/java/com/example/utilmod
        mkdir -p src/main/resources
        
        if [ -f UtilModClient.java ]; then
          mv UtilModClient.java src/main/java/com/example/utilmod/
        fi
        
        if [ -f fabric.mod.json ]; then
          mv fabric.mod.json src/main/resources/
        fi
        
        if [ -f en_us.json ]; then
          mv en_us.json src/main/resources/
        fi
        
        if [ -f utilmod.mixins.json ]; then
          mv utilmod.mixins.json src/main/resources/
        fi

    - name: Build Mod with Gradle
      run: gradle build --no-daemon

    - name: Upload Mod JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-jar
        path: build/libs/*.jar
