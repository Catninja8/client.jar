name: Build Java JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Keeps you on a stable runner before the automated migration
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      # Updated to v4 (uses modern Node rtimes)
      uses: actions/checkout@v4 

    - name: Set up JDK 17
      # Migrated to v5 to fix deprecation and Node warnings
      uses: actions/setup-java@v5 
      with:
        java-version: '17'
        distribution: 'temurin'
        # Optional: Adds dependency caching to speed up your builds
        cache: 'maven' # Change to 'gradle' if using Gradle

    # OPTION A: If your project uses Maven
    - name: Build with Maven
      run: mvn clean package

    # OPTION B: If your project uses Gradle (Uncomment below if needed)
    # - name: Build with Gradle
    #   run: ./gradlew build

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-built-jar
        path: target/*.jar # Use 'build/libs/*.jar' for Gradle
