name: Build Fabric Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # If your build.gradle requires Java 21, change this to '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradle Wrapper Executable
      # This fixes common permission errors when running Gradle on GitHub Linux runners
      run: chmod +x gradlew
      continue-on-error: true # Safe fallback if you don't use a local wrapper file

    - name: Build Mod with Gradle
      # Instructs Gradle to download dependencies (Fabric/Minecraft) and package the mod
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew build
        else
          gradle build
        fi

    - name: Upload Mod JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fabric-mod-jar
        # Fabric Gradle plugin places compiled mod jars into build/libs/
        path: build/libs/*.jar
