name: Build Java JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        # Removed caching since there are no build tool configuration files to track

    - name: Compile Java Files and Create JAR
      run: |
        mkdir bin
        # Compiles all java files found in your src directory into the bin folder
        find . -name "*.java" -exec javac -d bin {} +
        # Creates the JAR file from the compiled binaries
        jar cvf client.jar -C bin .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-built-jar
        path: client.jar
